version: 2
updates:
  # ============================================================
  # Rust Cargo Dependencies
  # ============================================================
  - package-ecosystem: cargo
    directory: "/usbvault-crypto"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "007Byte"
    assignees:
      - "007Byte"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps-cargo):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major version updates for critical dependencies
      # Review manually and schedule separately
      - dependency-name: "cryptography"
        update-types: ["version-update:semver-major"]
      # hkdf 0.13 requires hmac 0.13 → digest 0.11, which forces the entire
      # RustCrypto 0.11-era stack including aes-gcm-siv 0.12.0-rc.3 (a release
      # candidate). The anti-RC guard in .github/workflows/security.yml hard-fails
      # RC crypto crates. Block until aes-gcm-siv ships a stable aead-0.6 release.
      # See closed PRs #105 and #107 for full context.
      - dependency-name: "hkdf"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # generic-array 1.x is the new-era API; the RustCrypto 0.10-era crates
      # (sha2 0.10, hmac 0.12, chacha20poly1305 0.10, aes-gcm-siv 0.11) all
      # depend on generic-array 0.14. Moving our direct dep to 1.x causes 34
      # E0308 type-mismatch errors at the AES/ChaCha cipher trait boundaries.
      # Reopen when the whole 0.10-era stack migrates to aead-0.6 + digest-0.11.
      - dependency-name: "generic-array"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # Go Modules
  # ============================================================
  - package-ecosystem: gomod
    directory: "/usbvault-server"
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
    open-pull-requests-limit: 5
    reviewers:
      - "007Byte"
    assignees:
      - "007Byte"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps-go):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major version updates for critical dependencies
      - dependency-name: "github.com/gorilla/mux"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # NPM Dependencies
  # ============================================================
  - package-ecosystem: npm
    directory: "/usbvault-app"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
    open-pull-requests-limit: 5
    reviewers:
      - "007Byte"
    assignees:
      - "007Byte"
    labels:
      - "dependencies"
      - "javascript"
      - "react-native"
    commit-message:
      prefix: "chore(deps-npm):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
    # Group the Expo/React-Native SDK packages into a single PR. They are
    # version-locked to the installed Expo SDK and must move together; updating
    # them piecemeal breaks the SDK compatibility matrix (e.g. Dependabot once
    # bumped expo-crypto/expo-linking/expo-notifications to 55.x against SDK 54,
    # breaking `npm ci` with ERESOLVE).
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
          - "react"
          - "react-dom"
          - "react-test-renderer"
          - "@types/react"
          - "@types/react-native"
    ignore:
      # SDK-managed packages: do NOT let Dependabot bump majors/minors. These
      # are pinned by the Expo SDK; upgrade them deliberately via
      # `npx expo install --fix` during an SDK bump, not via Dependabot.
      # (Patch updates within the SDK are still allowed.)
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # react is pinned EXACTLY to 19.1.4 (RN 0.81.6 throws at runtime on any
      # other version). Block major AND minor bumps; patch bumps are still allowed.
      # Also ignore react-dom, @types/react, and react-test-renderer which are
      # grouped into expo-sdk and must stay version-locked to the SDK.
      # Re-open condition: deliberate SDK upgrade via `npx expo install --fix`.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # ============================================================
  # GitHub Actions
  # ============================================================
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "007Byte"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions):"
      include: "scope"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
