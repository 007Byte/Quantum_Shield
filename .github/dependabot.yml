version: 2
updates:
  # ============================================================
  # Rust Cargo Dependencies
  # ============================================================
  - package-ecosystem: cargo
    directory: "/usbvault-crypto"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - "007Byte"
    assignees:
      - "007Byte"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps-cargo):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major version updates for critical dependencies
      # Review manually and schedule separately
      - dependency-name: "cryptography"
        update-types: ["version-update:semver-major"]
      # RustCrypto ecosystem coupling. These crates share the digest/aead/
      # generic-array trait versions and MUST move as one coordinated set.
      # src/streaming.rs + src/sharing.rs construct keys with
      # generic-array 0.14's GenericArray and feed them to XChaCha20Poly1305 /
      # Hkdf<Sha256>, so bumping any one crate's breaking (pre-1.0 minor or
      # major) version alone yields a trait/type mismatch and fails the build
      # (closed PRs #143 hkdf 0.13, #145 generic-array 1.x, #105 sha2 0.11,
      # #107 chacha20poly1305 0.11). No CVE forces these (cargo-audit clean).
      # The only upstream versions that unblock the set pull aes-gcm-siv as a
      # release candidate, which the anti-RC gate in security.yml bans.
      # DEFER until the stack ships stable aead-0.6 releases; upgrade the whole
      # set together in one manual PR then. Patch updates still flow.
      - dependency-name: "hkdf"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "digest"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "chacha20poly1305"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "aes-gcm-siv"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "generic-array"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # Go Modules
  # ============================================================
  - package-ecosystem: gomod
    directory: "/usbvault-server"
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
    open-pull-requests-limit: 5
    reviewers:
      - "007Byte"
    assignees:
      - "007Byte"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps-go):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
    ignore:
      # Ignore major version updates for critical dependencies
      - dependency-name: "github.com/gorilla/mux"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # NPM Dependencies
  # ============================================================
  - package-ecosystem: npm
    directory: "/usbvault-app"
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
    open-pull-requests-limit: 5
    reviewers:
      - "007Byte"
    assignees:
      - "007Byte"
    labels:
      - "dependencies"
      - "javascript"
      - "react-native"
    commit-message:
      prefix: "chore(deps-npm):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
    # Group the Expo/React-Native SDK packages into a single PR. They are
    # version-locked to the installed Expo SDK and must move together; updating
    # them piecemeal breaks the SDK compatibility matrix (e.g. Dependabot once
    # bumped expo-crypto/expo-linking/expo-notifications to 55.x against SDK 54,
    # breaking `npm ci` with ERESOLVE).
    groups:
      expo-sdk:
        patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
          - "react"
          - "react-dom"
          - "react-test-renderer"
          - "@types/react"
          - "@types/react-native"
    ignore:
      # SDK-managed packages: do NOT let Dependabot bump majors/minors. These
      # are pinned by the Expo SDK; upgrade them deliberately via
      # `npx expo install --fix` during an SDK bump, not via Dependabot.
      # (Patch updates within the SDK are still allowed.)
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # react/react-dom/react-test-renderer are pinned to the EXACT version
      # React Native requires (RN 0.81.6 hard-asserts React.version === "19.1.4"
      # and throws otherwise), so EVEN A PATCH bump breaks React Native Checks —
      # closed PR #151 tried react 19.1.4->19.2.7 (minor) and PR #168 tried
      # 19.1.4->19.1.8 (patch), both broke CI. Ignore ALL updates; these move
      # only with a deliberate Expo SDK upgrade via `npx expo install --fix`.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-test-renderer"
      # @types/react tracks the React version; block minor+major (patch-only
      # type-def fixes are harmless).
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # tailwindcss 4.x is a breaking major (new engine, CSS-first config that
      # supersedes tailwind.config.js). Upgrade deliberately, not via Dependabot
      # — closed PR #170. Minor/patch within 3.x still flow.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  # ============================================================
  # GitHub Actions
  # ============================================================
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: tuesday
      time: "03:00"
    open-pull-requests-limit: 10
    reviewers:
      - "007Byte"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions):"
      include: "scope"
    rebase-strategy: "auto"
    allow:
      - dependency-type: "all"
